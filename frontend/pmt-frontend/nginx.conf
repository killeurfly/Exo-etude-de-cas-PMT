server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les routes Angular (/dashboard, /projects/1…) n'existent pas en fichiers :
    # on renvoie index.html et le routeur Angular affiche la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
