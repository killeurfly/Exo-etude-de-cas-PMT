name: CI

on:
  push:
    branches:
      - main
      - feature/pmt-development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/pmt-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/pmt-frontend

      - name: Run tests with coverage (minimum 60 %)
        run: npx ng test --watch=false --coverage
        working-directory: frontend/pmt-frontend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/pmt-frontend/coverage/
          if-no-files-found: ignore

      - name: Build application
        run: npm run build
        working-directory: frontend/pmt-frontend

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pmt-backend/pom.xml

      - name: Run tests, check coverage (minimum 60 %) and package application
        run: bash ./mvnw -B verify
        working-directory: backend/pmt-backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/pmt-backend/target/site/jacoco/
          if-no-files-found: ignore
