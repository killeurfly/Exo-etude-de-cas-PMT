name: CI

on:
  push:
    branches:
      - main
      - feature/pmt-development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/pmt-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/pmt-frontend

      - name: Run tests
        run: npx ng test --watch=false
        working-directory: frontend/pmt-frontend

      - name: Build application
        run: npm run build
        working-directory: frontend/pmt-frontend

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pmt-backend/pom.xml

      - name: Run tests and package application
        run: bash ./mvnw -B verify
        working-directory: backend/pmt-backend
